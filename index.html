<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DayFlow — Daily Task Planner</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <!-- Header -->
  <header class="df-header">
    <div class="df-header-inner">
        <a href="#" class="df-brand">
          <svg class="df-logo" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="36" height="36" rx="10" fill="var(--accent)"/>
            <path d="M10 13h10M10 18h14M10 23h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="26" cy="23" r="4" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="1.8"/>
            <path d="M24.5 23l1 1 2-2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="df-wordmark">DayFlow</span>
        </a>
        <div class="df-header-actions">
        <button class="df-btn df-btn-ghost df-history-btn" id="historyBtn" aria-label="View task history" title="Task history">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2.5"/></svg>
          <span class="df-history-label">History</span>
        </button>
        <button class="df-theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        </div>
    </div>
  </header>

  <!-- History Modal -->
  <div class="df-modal-backdrop" id="historyBackdrop" hidden>
    <div class="df-modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <div class="df-modal-header">
        <h2 class="df-modal-title" id="historyTitle">Task History</h2>
        <button class="df-btn-icon" id="historyClose" aria-label="Close history"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
      </div>
      <div class="df-modal-body" id="historyList"></div>
    </div>
  </div>

  <!-- Main -->
  <main class="df-main">
    <div>

      <!-- Date Navigation -->
      <div class="df-date-nav">
        <button class="df-nav-btn" id="prevDayBtn" aria-label="Previous day">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4l-6 6 6 6"/></svg>
        </button>
        <div class="df-date-center">
          <div class="df-date-title-row">
            <h1 class="df-title" id="currentDate"></h1>
            <span class="df-today-indicator" id="todayIndicator" aria-label="Today">TODAY</span>
          </div>
          <button class="df-today-badge" id="todayBtn" aria-label="Go to today">← Today</button>
        </div>
        <button class="df-nav-btn" id="nextDayBtn" aria-label="Next day">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l6 6-6 6"/></svg>
        </button>
      </div>

      <!-- Stats Cards -->
      <div class="df-stats-grid" id="statsGrid">
        <div class="df-stat-card">
          <span class="df-stat-value" id="statTotal">0</span>
          <span class="df-stat-label">Total</span>
        </div>
        <div class="df-stat-card">
          <span class="df-stat-value" id="statPending">0</span>
          <span class="df-stat-label">Pending</span>
        </div>
        <div class="df-stat-card">
          <span class="df-stat-value" id="statCompleted">0</span>
          <span class="df-stat-label">Completed</span>
        </div>
        <div class="df-stat-card df-stat-accent">
          <span class="df-stat-value" id="statPercent">0%</span>
          <span class="df-stat-label">Done</span>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="df-progress-wrap">
        <div class="df-progress-bar-bg">
          <div class="df-progress-bar-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span class="df-progress-label" id="progressLabel">0% complete</span>
      </div>

      <!-- Add Task -->
      <div class="df-card df-add-card">
        <div class="df-add-row">
          <input
            type="text"
            id="taskInput"
            class="df-input"
            placeholder="What needs to be done?"
            maxlength="200"
            autocomplete="off"
            aria-label="New task title"
          />
          <button class="df-btn df-btn-primary" id="addBtn" aria-label="Add task">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/></svg>
            Add
          </button>
        </div>
        <p class="df-validation-msg" id="validationMsg" aria-live="polite"></p>
      </div>

      <!-- Toolbar: Search + Filters + Clear Completed -->
      <div class="df-toolbar">
        <div class="df-search-wrap">
          <svg class="df-search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5"/><path d="M15 15l-3-3" stroke-linecap="round"/>
          </svg>
          <input
            type="search"
            id="searchInput"
            class="df-input df-search-input"
            placeholder="Search tasks…"
            aria-label="Search tasks"
            autocomplete="off"
          />
        </div>
        <div class="df-filters" role="group" aria-label="Filter tasks">
          <button class="df-filter-btn active" data-filter="all">All</button>
          <button class="df-filter-btn" data-filter="pending">Pending</button>
          <button class="df-filter-btn" data-filter="completed">Completed</button>
        </div>
        <button class="df-btn df-btn-ghost df-clear-btn" id="clearCompletedBtn" aria-label="Clear completed tasks">
          Clear Completed
        </button>
      </div>

      <!-- Task List -->
      <div id="taskList" class="df-task-list" aria-label="Task list" aria-live="polite"></div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
